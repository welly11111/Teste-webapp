<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>bytecode — canal</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  * { box-sizing: border-box; }
  body {
    margin: 0; background: #F6F7FB; color: #12131A;
    font-family: 'Inter', sans-serif; min-height: 100vh;
  }
  .display { font-family: 'Space Grotesk', sans-serif; }
  svg { display: block; }

  header.topbar {
    display: flex; align-items: center; gap: 10px;
    padding: 16px 20px; border-bottom: 1px solid #E3E6EE; background: #FFFFFF;
  }
  .brand-mark {
    width: 30px; height: 30px; border-radius: 8px; background: #4F46E5;
    color: #fff; display: flex; align-items: center; justify-content: center; font-weight: 700; font-size: 14px;
  }
  .brand-name { font-family: 'Space Grotesk', sans-serif; font-weight: 700; font-size: 16px; }

  main { max-width: 900px; margin: 0 auto; padding: 28px 20px 100px; }
  .view { display: none; }
  .view.active { display: block; }

  h1.hero-title { font-family: 'Space Grotesk', sans-serif; font-size: 28px; font-weight: 700; line-height: 1.25; margin: 0 0 10px; }
  p.tagline { color: #626878; font-size: 15px; line-height: 1.6; margin: 0 0 20px; max-width: 460px; }
  .btn-primary {
    display: inline-flex; align-items: center; gap: 8px; background: #12131A; color: #fff;
    border: none; padding: 12px 20px; border-radius: 10px; font-weight: 600; font-size: 14px; cursor: pointer;
  }
  .btn-primary:hover { background: #4F46E5; }

  .stats { display: flex; gap: 28px; margin: 24px 0 32px; }
  .stat-num { font-family: 'Space Grotesk', sans-serif; font-size: 20px; font-weight: 700; }
  .stat-label { font-size: 12px; color: #626878; }

  h2.section-title { font-size: 18px; font-weight: 700; margin: 0 0 14px; }

  .video-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 16px; }
  .video-card { background: #fff; border: 1px solid #E3E6EE; border-radius: 12px; overflow: hidden; }
  .thumb { position: relative; aspect-ratio: 16/9; background: #4F46E5; display: flex; align-items: center; justify-content: center; }
  .duration-badge {
    position: absolute; bottom: 8px; right: 8px; background: rgba(0,0,0,.6); color: #fff;
    font-size: 10px; padding: 2px 6px; border-radius: 4px;
  }
  .video-meta { padding: 12px; }
  .video-title { font-weight: 600; font-size: 13px; line-height: 1.4; margin: 0 0 6px; }
  .video-sub { font-size: 12px; color: #626878; }

  .playlist-list { display: flex; flex-direction: column; gap: 12px; }
  .playlist-card {
    display: flex; align-items: center; gap: 14px; background: #fff;
    border: 1px solid #E3E6EE; border-radius: 12px; padding: 14px 16px;
  }
  .playlist-icon {
    width: 44px; height: 44px; border-radius: 10px; background: #EEEDFD; color: #4F46E5;
    display: flex; align-items: center; justify-content: center; flex-shrink: 0;
  }
  .playlist-title { font-weight: 600; font-size: 14px; margin: 0 0 2px; }
  .playlist-desc { color: #626878; font-size: 12px; }
  .playlist-count { font-size: 12px; color: #626878; margin-left: auto; white-space: nowrap; }

  .links-list { display: flex; flex-direction: column; gap: 12px; }
  .link-card {
    display: flex; align-items: center; gap: 14px; background: #fff; border: 1px solid #E3E6EE;
    border-radius: 12px; padding: 14px 16px; text-decoration: none; color: #12131A;
  }
  .link-card.primary { background: #12131A; color: #fff; border-color: #12131A; }
  .link-icon-wrap {
    width: 38px; height: 38px; border-radius: 9px; background: #EEEDFD; color: #4F46E5;
    display: flex; align-items: center; justify-content: center; flex-shrink: 0;
  }
  .link-card.primary .link-icon-wrap { background: rgba(255,255,255,.15); color: #fff; }
  .link-label { font-weight: 600; font-size: 14px; }
  .link-value { font-size: 12px; color: #626878; }
  .link-card.primary .link-value { color: rgba(255,255,255,.65); }

  /* BOTTOM NAV */
  nav.bottombar {
    position: fixed; bottom: 0; left: 0; right: 0; background: #FFFFFF;
    border-top: 1px solid #E3E6EE; display: flex; justify-content: space-around;
    padding: 8px 0; padding-bottom: max(8px, env(safe-area-inset-bottom));
  }
  .tab {
    display: flex; flex-direction: column; align-items: center; gap: 4px;
    background: none; border: none; cursor: pointer; color: #9198A8; font-size: 11px;
    font-family: 'Inter', sans-serif; padding: 4px 14px;
  }
  .tab.active { color: #4F46E5; }

  @media (max-width: 520px) {
    .video-grid { grid-template-columns: 1fr; }
  }
  :focus-visible { outline: 2px solid #4F46E5; outline-offset: 2px; }
</style>
</head>
<body>

<header class="topbar">
  <div class="brand-mark">B</div>
  <div class="brand-name">bytecode</div>
</header>

<main>

  <section class="view active" id="view-home">
    <h1 class="hero-title">Programação, hardware e experimentos de tecnologia — sem enrolação.</h1>
    <p class="tagline">Vídeos toda semana sobre dev, IA e tudo que é tech.</p>
    <button class="btn-primary">Inscrever-se</button>
    <div class="stats">
      <div><div class="stat-num">184 mil</div><div class="stat-label">inscritos</div></div>
      <div><div class="stat-num">312</div><div class="stat-label">vídeos</div></div>
      <div><div class="stat-num">9,4 mi</div><div class="stat-label">visualizações</div></div>
    </div>
    <h2 class="section-title">Últimos vídeos</h2>
    <div class="video-grid" id="home-videos"></div>
  </section>

  <section class="view" id="view-videos">
    <h2 class="section-title">Vídeos</h2>
    <div class="video-grid" id="all-videos"></div>
  </section>

  <section class="view" id="view-playlists">
    <h2 class="section-title">Playlists</h2>
    <div class="playlist-list" id="all-playlists"></div>
  </section>

  <section class="view" id="view-links">
    <h2 class="section-title">Links</h2>
    <div class="links-list" id="all-links"></div>
  </section>

</main>

<nav class="bottombar">
  <button class="tab active" data-tab="home">
    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/></svg>
    Início
  </button>
  <button class="tab" data-tab="videos">
    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="2" y="4" width="20" height="16" rx="2"/><path d="M10 9l5 3-5 3z"/></svg>
    Vídeos
  </button>
  <button class="tab" data-tab="playlists">
    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="8" y1="6" x2="21" y2="6"/><line x1="8" y1="12" x2="21" y2="12"/><line x1="8" y1="18" x2="21" y2="18"/></svg>
    Playlists
  </button>
  <button class="tab" data-tab="links">
    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M10 13a5 5 0 0 0 7.54.54l3-3a5 5 0 0 0-7.07-7.07l-1.72 1.71"/><path d="M14 11a5 5 0 0 0-7.54-.54l-3 3a5 5 0 0 0 7.07 7.07l1.71-1.71"/></svg>
    Links
  </button>
</nav>

<script>
  const VIDEOS = [
    { title: "Testei a nova IA que substitui Devs?", duration: "12:34", views: "45 mil", time: "há 2 dias" },
    { title: "Montei um PC de R$3.000", duration: "18:02", views: "102 mil", time: "há 5 dias" },
    { title: "5 extensões do VS Code essenciais", duration: "9:47", views: "28 mil", time: "há 1 semana" },
    { title: "Rust vale a pena em 2026?", duration: "22:15", views: "61 mil", time: "há 2 semanas" },
    { title: "Comparei 3 nuvens gratuitas", duration: "15:30", views: "34 mil", time: "há 3 semanas" },
    { title: "Construí uma API do zero em 1 hora", duration: "27:41", views: "19 mil", time: "há 1 mês" },
    { title: "O erro de segurança que quase quebrou tudo", duration: "11:09", views: "88 mil", time: "há 1 mês" },
    { title: "Meu setup de home office 2026", duration: "14:20", views: "52 mil", time: "há 2 meses" },
  ];

  const PLAYLISTS = [
    { title: "Fundamentos de Programação", count: 24, desc: "Do zero à lógica de verdade." },
    { title: "Reviews de Hardware", count: 15, desc: "PCs e componentes testados na prática." },
    { title: "Projetos ao Vivo", count: 32, desc: "Código sendo escrito em tempo real." },
    { title: "Carreira em Tech", count: 18, desc: "Entrevistas e bastidores da área." },
  ];

  const LINKS = [
    { label: "Inscreva-se no canal", value: "@bytecode.dev", primary: true, icon: 'youtube' },
    { label: "Instagram", value: "@bytecode.dev", icon: 'instagram' },
    { label: "X / Twitter", value: "@bytecodedev", icon: 'twitter' },
    { label: "Site & portfólio", value: "bytecode.dev", icon: 'globe' },
    { label: "Contato comercial", value: "contato@bytecode.dev", icon: 'mail' },
  ];

  const ICONS = {
    youtube: '<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M22 8.5c0-3-2-4.5-5-4.5H7c-3 0-5 1.5-5 4.5v7c0 3 2 4.5 5 4.5h10c3 0 5-1.5 5-4.5z"/><path d="M10 9l5 3-5 3z"/></svg>',
    instagram: '<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="2" y="2" width="20" height="20" rx="5"/><circle cx="12" cy="12" r="4"/></svg>',
    twitter: '<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M23 3a10.9 10.9 0 0 1-3.14 1.53 4.48 4.48 0 0 0-7.86 3v1A10.66 10.66 0 0 1 3 4s-4 9 5 13a11.64 11.64 0 0 1-7 2c9 5 20 0 20-11.5a4.5 4.5 0 0 0-.08-.83A7.72 7.72 0 0 0 23 3z"/></svg>',
    globe: '<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"/><line x1="2" y1="12" x2="22" y2="12"/><path d="M12 2a15.3 15.3 0 0 1 4 10 15.3 15.3 0 0 1-4 10 15.3 15.3 0 0 1-4-10 15.3 15.3 0 0 1 4-10z"/></svg>',
    mail: '<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="2" y="4" width="20" height="16" rx="2"/><path d="M22 6l-10 7L2 6"/></svg>',
  };

  function videoCard(v) {
    return `
      <div class="video-card">
        <div class="thumb">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="#fff"><polygon points="6 4 20 12 6 20"/></svg>
          <span class="duration-badge">${v.duration}</span>
        </div>
        <div class="video-meta">
          <p class="video-title">${v.title}</p>
          <p class="video-sub">${v.views} · ${v.time}</p>
        </div>
      </div>`;
  }

  function playlistCard(p) {
    return `
      <div class="playlist-card">
        <div class="playlist-icon">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="8" y1="6" x2="21" y2="6"/><line x1="8" y1="12" x2="21" y2="12"/><line x1="8" y1="18" x2="21" y2="18"/></svg>
        </div>
        <div>
          <p class="playlist-title">${p.title}</p>
          <p class="playlist-desc">${p.desc}</p>
        </div>
        <span class="playlist-count">${p.count} vídeos</span>
      </div>`;
  }

  function linkCard(l) {
    return `
      <a href="#" class="link-card ${l.primary ? 'primary' : ''}" onclick="return false">
        <div class="link-icon-wrap">${ICONS[l.icon]}</div>
        <div>
          <p class="link-label">${l.label}</p>
          <p class="link-value">${l.value}</p>
        </div>
      </a>`;
  }

  document.getElementById('home-videos').innerHTML = VIDEOS.slice(0, 2).map(videoCard).join('');
  document.getElementById('all-videos').innerHTML = VIDEOS.map(videoCard).join('');
  document.getElementById('all-playlists').innerHTML = PLAYLISTS.map(playlistCard).join('');
  document.getElementById('all-links').innerHTML = LINKS.map(linkCard).join('');

  document.querySelectorAll('.tab').forEach(tab => {
    tab.addEventListener('click', () => {
      document.querySelectorAll('.tab').forEach(t => t.classList.toggle('active', t === tab));
      document.querySelectorAll('.view').forEach(v => v.classList.toggle('active', v.id === 'view-' + tab.dataset.tab));
      window.scrollTo(0, 0);
    });
  });
</script>

</body>
</html>
